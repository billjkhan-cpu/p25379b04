<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Semi">
<meta name="theme-color" content="#0b5d4b">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Semi de Boulogne</title>
<style>
:root{--bg:#f2f1ed;--card:#fff;--card2:#f7f6f2;--ink:#14202b;--mut:#6c7581;--line:#e5e2db;--acc:#0b5d4b;--acc2:#e3f1ec;
--easy:#3b8a5f;--long:#2167a0;--key:#c2482b;--qual:#b07a12;--bike:#7652b0;--rest:#a0a6ad;--race:#c2482b;
--drink:#e6f0f8;--renfo:#f1ecfa;--done:#e5f3ea;--cap:#fbf0e3;--tab:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1218;--card:#161f29;--card2:#1c2632;--ink:#e9edf1;--mut:#8f9aa7;--line:#25313e;
--acc:#4cc2a0;--acc2:#143129;--drink:#132535;--renfo:#211b31;--done:#13291e;--cap:#2a2015;--tab:rgba(22,31,41,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acc);text-decoration:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 92px)}
.view{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide{animation:sl .24s ease}@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.1;margin:10px 2px 14px;letter-spacing:-.02em}
h2{font-size:20px;margin:22px 2px 10px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chev::after{content:"›";font-size:24px;color:var(--mut);line-height:1;margin-left:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;color:#fff;background:var(--rest)}
.t-FACILE{--c:var(--easy)}.t-LONGUE{--c:var(--long)}.t-CLE{--c:var(--key)}.t-TEST{--c:var(--key)}.t-QUALITE{--c:var(--qual)}
.t-KICKR{--c:var(--bike)}.t-REPOS{--c:var(--rest)}.t-COURSE{--c:var(--race)}
.pill.t{background:var(--c)}.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* hero */
.hero{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px;letter-spacing:-.03em;line-height:1}.ring small{font-size:12px;color:var(--mut)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{background:var(--card2);border-radius:12px;padding:8px 10px}
.kv small{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:18px;white-space:nowrap}
.kv em{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.hero .kv3{grid-template-columns:1fr;gap:6px;flex:1}.hero .kv{display:flex;justify-content:space-between;align-items:baseline}
/* today card */
.big{border-left:6px solid var(--c);padding:16px}
.big .titre{font-size:21px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;background:var(--card2);border-radius:20px;padding:4px 10px;white-space:nowrap}
.chip b{font-weight:700}
.cta{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:12px;background:var(--acc);color:#fff;border-radius:12px;padding:11px;font-weight:600}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;background:var(--card)}
.sd small{font-size:11px;color:var(--mut);text-transform:uppercase}.sd b{font-size:17px}
.sd.today{outline:2px solid var(--acc)}.sd.done b::after{content:"✓";color:var(--easy);font-size:11px;margin-left:2px;vertical-align:top}
/* list */
.list{background:var(--card);border-radius:18px;overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}.li:active{background:var(--card2)}
.li{align-items:flex-start}.li .dot{margin-top:15px}.li .chev{align-self:center}.li .d{width:40px;text-align:center;flex:none;line-height:1.05}.li .d small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}.li .d b{font-size:20px}
.li .tt{font-weight:600;font-size:15px}.li .ss{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li.rest .tt{color:var(--ink);opacity:.75;font-weight:500}.li.today{background:var(--acc2)}
.ok{color:var(--easy);font-weight:700}
.badge{font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:20px;padding:2px 7px;margin-left:6px;vertical-align:middle}
/* week chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;scrollbar-width:none;scroll-padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.wc{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.wc.on{background:var(--ink);color:var(--bg)}.wc.cur:not(.on){box-shadow:inset 0 0 0 2px var(--acc)}
.wsum{display:flex;gap:6px;flex-wrap:wrap;margin:4px 2px 0}
/* detail */
.back{display:flex;align-items:center;gap:4px;color:var(--acc);font-size:17px;padding:6px 0}
.back::before{content:"‹";font-size:30px;line-height:.8}
.dh{border-radius:20px;padding:18px 16px;background:var(--c);color:#fff;margin-top:6px}
.dh .titre{font-size:23px;font-weight:700;line-height:1.2;margin:6px 0 10px}
.dh .chip{background:rgba(255,255,255,.2);color:#fff}
.prof{display:flex;align-items:flex-end;gap:2px;height:84px;margin:4px 0 2px}
.prof div{background:var(--c);border-radius:4px 4px 0 0;opacity:.55;min-width:3px}
.prof div.f{opacity:1}.prof div.w{opacity:.25}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.step:last-child{border:0}.step .n{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.f .n{background:var(--c);color:#fff}.step .lab{font-weight:600;font-size:15px}.step .md{font-size:12px;color:var(--mut)}
.step .v{text-align:right;white-space:nowrap}.step .v b{font-size:18px}.step .v small{display:block;font-size:12px;color:var(--mut)}
details.acc{background:var(--card);border-radius:16px;margin:10px 0;overflow:hidden}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font-weight:600;cursor:pointer}
details.acc>summary .sm{display:block;font-weight:400;font-size:13px;color:var(--mut)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .ab{padding:0 14px 14px;font-size:15px}
details.acc .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.i-drink{background:var(--drink)}.i-renfo{background:var(--renfo)}.i-cons{background:var(--card2)}.i-done{background:var(--done)}.i-cap{background:var(--cap)}
.cap{display:flex;align-items:center;gap:10px;background:var(--cap);border-radius:14px;padding:12px 14px;margin:10px 0}
.cap b{font-size:22px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.res{display:flex;gap:4px}.res i{width:18px;height:6px;border-radius:3px;background:var(--line)}.res i.on{background:var(--easy)}
.pn{display:flex;gap:10px;margin-top:16px}.pn button{flex:1;background:var(--card);border-radius:14px;padding:12px;font-size:14px;text-align:left}
.pn button{display:flex;flex-direction:column;justify-content:flex-start}.pn button:last-child{text-align:right;align-items:flex-end}.pn small{display:block;color:var(--mut);font-size:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.check:last-child{border:0}.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.check.on .box{background:var(--easy);border-color:var(--easy)}.check.on .box::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.check.on .tx{color:var(--mut);text-decoration:line-through}
/* charts */
.chart{width:100%;display:block}.chart text{font-size:10px;fill:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:600}table.t td:not(:first-child),table.t th:not(:first-child){text-align:right}
table.t tr:last-child td{border:0}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0}
nav button.on{color:var(--acc)}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:24px}
p{margin:6px 0}
</style>

<script type="text/plain" id="main">
const D=window.__D;
const $=s=>document.querySelector(s);
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const TYPES={REPOS:'Repos',FACILE:'Footing',LONGUE:'Sortie longue',CLE:'Séance clé',QUALITE:'Seuil',TEST:'Test',KICKR:'Vélo Kickr',COURSE:'Course'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(x,d=1)=>x==null?'—':(+x).toFixed(d).replace('.',',').replace(/,0$/,'');
const dt=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const W0=dt('2026-09-28');
const week=s=>Math.floor((dt(s)-W0)/6048e5)+1;
const dlabel=s=>{const d=dt(s);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]};
const rel=s=>{const n=Math.round((dt(s)-dt(TODAY))/864e5);return n===0?"aujourd'hui":n===1?'demain':n===-1?'hier':dlabel(s)};
const REAL={};D.real.forEach(r=>(REAL[r.date]=REAL[r.date]||[]).push(r));
const DAYS=D.days, BY={};DAYS.forEach((d,i)=>{d.i=i;BY[d.date]=d});
const store={get:k=>{try{return JSON.parse(localStorage.getItem('semi:'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('semi:'+k,JSON.stringify(v))}catch(e){}}};

function dur(d){ if(d.steps) return d.steps.reduce((a,s)=>a+s.min,0); if(d.bike) return Math.round(d.bike.reduce((a,s)=>a+s.min,0));
  const m=(d.detail||'').match(/(\d+)\s*min/g); return m&&d.type!=='REPOS'?m.reduce((a,x)=>a+parseInt(x),0):0 }
function km(d){ return d.steps? d.steps.reduce((a,s)=>a+s.kmh*s.min/60,0):0 }
function hm(m){ if(!m) return ''; const h=Math.floor(m/60),r=Math.round(m%60); return h?h+'h'+(r?String(r).padStart(2,'0'):''):r+' min' }
function summary(d){ if(d.type==='REPOS') return d.renfo?'Renfo 15 min':(d.detail||'Récupération');
  const p=[]; const m=dur(d); if(m) p.push(hm(m)); const k=km(d); if(k) p.push('~'+num(k)+' km');
  if(d.plafond) p.push('FC < '+d.plafond); if(d.bike) p.push('ERG'); if(d.renfo) p.push('+ renfo'); return p.join(' · ')||d.detail }
const nextSession=()=>DAYS.find(d=>d.date>=TODAY&&d.type!=='REPOS'&&!REAL[d.date]);

/* ---------- vues ---------- */
function vHome(){
  const j=Math.round((dt(D.course)-dt(TODAY))/864e5), tot=Math.round((dt(D.course)-dt('2026-10-01'))/864e5);
  const pr=Math.min(1,Math.max(0,1-j/tot)), C=2*Math.PI*50;
  const t=BY[TODAY], n=nextSession();
  const runs=D.real.filter(r=>r.km_tapis), kmT=runs.reduce((a,r)=>a+r.km_tapis,0), lg=Math.max(0,...runs.map(r=>r.km_tapis));
  const mon=new Date(dt(TODAY));mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let strip='';for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const s=iso(x),d=BY[s];
    strip+=`<button class="sd t-${d?d.type:'REPOS'} ${s===TODAY?'today':''} ${REAL[s]?'done':''}" onclick="go('#/j/${s}')"><small>${JOURS[x.getDay()].slice(0,3)}</small><b>${x.getDate()}</b><span class="dot"></span></button>`}
  const main=(t&&t.type!=='REPOS')?t:n;
  const lab=main===t?"Aujourd'hui":'Prochaine séance · '+rel(main.date);
  const ckey='boire:'+TODAY;
  return `<div class="view">
  <div class="sub" style="margin:8px 2px 0">Semi de Boulogne · dim. 15 nov. · 9h00</div>
  <h1>${j>0?'Bonjour':j===0?"C'est le jour J":'Bravo Bill'}</h1>
  <div class="card hero">

function vPlan(w){

  const ds=DAYS.filter(d=>week(d.date)===w);
  const run=ds.filter(d=>d.steps), mins=ds.reduce((a,d)=>a+dur(d),0), kms=run.reduce((a,d)=>a+km(d),0);
  const done=ds.filter(d=>REAL[d.date]).length, todo=ds.filter(d=>d.type!=='REPOS').length;
  const rows=ds.map(d=>{const x=dt(d.date),r=REAL[d.date];return `<button class="li t-${d.type} ${d.type==='REPOS'?'rest':''} ${d.date===TODAY?'today':''}" onclick="go('#/j/${d.date}')">

   <div class="list">${rows}</div></div>`;
}

function profile(d){
  const st=d.steps||d.bike; if(!st) return '';
  const tot=st.reduce((a,s)=>a+s.min,0);
  const v=s=>d.steps?s.kmh:s.lvl, lo=d.steps?4:.3, hi=d.steps?Math.max(10,...st.map(v)):Math.max(.9,...st.map(v));
  const h=x=>Math.max(8,(x-lo)/(hi-lo)*100);
  const bars=st.map(s=>{const walk=/marche/i.test(s.mode||'');
    if(s.ramp){const[a,z]=s.ramp;return [0,1,2].map(k=>`<div style="flex:${s.min/3};height:${h(a+(z-a)*(k+.5)/3)}%"></div>`).join('')}
    return `<div class="${s.fast?'f':''} ${walk?'w':''}" style="flex:${s.min};height:${h(v(s))}%"></div>`}).join('');
  return `<div class="card"><div class="prof">${bars}</div><div class="axis"><span>0</span><span>${hm(Math.round(tot/2))}</span><span>${hm(tot)}</span></div></div>`;
}

function bars(data,h=150){ // data:[{l,a,b}] a=prevu b=fait
  const W=340,pad=22,bw=(W-pad)/data.length, mx=Math.max(1,...data.map(d=>Math.max(d.a,d.b)));
  let g='';data.forEach((d,i)=>{const x=pad+i*bw, ha=d.a/mx*(h-30), hb=d.b/mx*(h-30);
   g+=`<g onclick="go('${d.go}')" style="cursor:pointer"><rect x="${x+bw*.18}" y="${h-18-ha}" width="${bw*.64}" height="${ha}" rx="4" fill="var(--line)"/>
    <rect x="${x+bw*.18}" y="${h-18-hb}" width="${bw*.64}" height="${hb}" rx="4" fill="var(--acc)"/>
    <text x="${x+bw/2}" y="${h-4}" text-anchor="middle">${d.l}</text>${d.a?`<text x="${x+bw/2}" y="${h-22-Math.max(ha,hb)}" text-anchor="middle">${d.t||''}</text>`:''}</g>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function vStats(){
  const ws=[...new Set(DAYS.map(d=>week(d.date)))].filter(w=>w<=7);
  const vol=ws.map(w=>{const ds=DAYS.filter(d=>week(d.date)===w);const a=ds.reduce((s,d)=>s+dur(d),0);
    const b=D.real.filter(r=>week(r.date)===w).reduce((s,r)=>s+(r.min||0),0);return{l:'S'+w,a,b,t:b?hm(b):hm(a),go:'#/plan/'+w}});
  const longs=DAYS.filter(d=>['LONGUE','CLE'].includes(d.type)&&d.steps);
  const lg=longs.map(d=>{const r=(REAL[d.date]||[])[0];return{l:dt(d.date).getDate()+'/'+(dt(d.date).getMonth()+1),a:dur(d),b:r?r.min:0,t:hm(r?r.min:dur(d)),go:'#/j/'+d.date}});
  const runs=D.real.filter(r=>r.km_tapis);
  // FC moyenne vs vitesse des seances de course
  const W=340,H=160; const xs=runs.map(r=>r.vitesse_moy_tapis||r.km_tapis/(r.min/60)), ys=runs.map(r=>r.fc_moy);
  const x0=6,x1=Math.max(10,...xs),y0=120,y1=180, X=v=>24+(v-x0)/(x1-x0)*(W-34), Y=v=>H-18-(v-y0)/(y1-y0)*(H-30);
  let sc='';[130,150,170].forEach(v=>sc+=`<line x1="24" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="2" y="${Y(v)+3}">${v}</text>`);
  [6,7,8,9].forEach(v=>sc+=`<text x="${X(v)}" y="${H-4}" text-anchor="middle">${v}</text>`);
  const placed=[],labs=[];
  runs.map((r,i)=>[r,i]).sort((p,q)=>q[0].min-p[0].min).forEach(([r,i])=>{const op=.35+.65*(i+1)/runs.length,rad=4+Math.min(8,r.min/12),cx=X(xs[i]),cy=Y(ys[i]);
   sc+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="var(--long)" fill-opacity="${op}" stroke="var(--card)" stroke-width="1.5" onclick="go('#/j/${r.date}')"/>`;
   placed.push([cx,cy,rad]);labs.push([r,cx,cy,rad])});
  const boxes=[];const hit=(x,y)=>boxes.some(b=>Math.abs(b[0]-x)<26&&Math.abs(b[1]-y)<11)||placed.some(p=>Math.hypot(p[0]-x,p[1]-y+3)<p[2]+3);
  labs.forEach(([r,cx,cy,rad])=>{const t=dt(r.date).getDate()+'/'+(dt(r.date).getMonth()+1);
   const opts=[[cx,cy-rad-4],[cx,cy+rad+11],[cx+rad+16,cy+4],[cx-rad-16,cy+4],[cx,cy-rad-16],[cx,cy+rad+23]];
   const o=opts.find(([x,y])=>!hit(x,y)&&y>12&&y<H-20); if(o){boxes.push(o);sc+=`<text x="${o[0]}" y="${o[1]}" text-anchor="middle" style="fill:var(--ink)">${t}</text>`}});
  sc+=`<line x1="${X(D.ac)}" x2="${X(D.ac)}" y1="8" y2="${H-18}" stroke="var(--key)" stroke-dasharray="4 3"/><text x="${X(D.ac)-4}" y="16" text-anchor="end" style="fill:var(--key)">allure semi ${num(D.ac)} km/h</text><text x="${W}" y="${H-22}" text-anchor="end">km/h</text><text x="2" y="10">bpm</text>`;
  const tbl=D.real.slice().reverse().map(r=>`<tr onclick="go('#/j/${r.date}')"><td>${dt(r.date).getDate()}/${dt(r.date).getMonth()+1} <span class="sub">${esc(r.km_tapis?'course':'vélo')}</span></td><td>${r.km_tapis?num(r.km_tapis,2):'—'}</td><td>${hm(r.min)}</td><td>${r.fc_moy||'—'}</td><td>${r.ressenti?r.ressenti+'/5':'—'}</td></tr>`).join('');
  const kmT=runs.reduce((a,r)=>a+r.km_tapis,0), minT=D.real.reduce((a,r)=>a+(r.min||0),0);
  return `<div class="view"><h1>Stats</h1>
   <div class="kv3"><div class="kv"><small>Km courus</small><b>${num(kmT)}</b></div><div class="kv"><small>Temps total</small><b>${hm(minT)}</b></div><div class="kv"><small>Séances</small><b>${D.real.length}</b></div></div>
   <h2>Volume par semaine</h2><div class="card">${bars(vol)}<div class="legend"><span><i style="background:var(--line)"></i>prévu</span><span><i style="background:var(--acc)"></i>fait</span></div><p class="sub">Chiffre affiché : le réalisé s'il existe, sinon le prévu. Touchez une barre pour ouvrir la semaine.</p></div>
   <h2>Sorties longues</h2><div class="card">${bars(lg)}<div class="legend"><span><i style="background:var(--line)"></i>prévu</span><span><i style="background:var(--acc)"></i>fait</span></div></div>
   <h2>FC moyenne selon la vitesse</h2><div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}">${sc}</svg>
    <p class="sub">Chaque point = une séance de course, plus il est gros plus elle est longue, plus il est foncé plus elle est récente. Le but : des points plus bas (moins de FC) ou plus à droite (plus vite).</p></div>
   <h2>Séances faites</h2><div class="card"><table class="t"><tr><th>Date</th><th>km</th><th>Durée</th><th>FC</th><th>Res.</th></tr>${tbl}</table></div></div>`;
}

<script>
