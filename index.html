<title>Semi de Boulogne</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--card2:#f2f2ef;--ink:#17211f;--mut:#68716e;--line:#e4e5df;--acc:#075f4c;--acc2:#e2f0eb;

--acc:#4cc2a0;--acc2:#143129;--drink:#132535;--renfo:#211b31;--done:#13291e;--cap:#2a2015;--tab:rgba(22,31,41,.9);--surface-raised:#161f29;--shadow-card:0 12px 34px rgba(0,0,0,.22);--nav-glass:rgba(18,26,34,.86)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none;-webkit-font-smoothing:auto;text-rendering:optimizeLegibility;letter-spacing:-.006em}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

#app{width:100%;max-width:640px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 124px);overflow-x:hidden}
.view{animation:in .22s ease}

.slide{animation:sl .24s ease}@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.li:last-child{border-bottom:0}.li:active{background:var(--card2)}
.li{align-items:flex-start}.li .dot{margin-top:15px}.li .chev{align-self:center}.li .d{width:40px;text-align:center;flex:none;line-height:1.05}.li .d small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}.li .d b{font-size:20px}

.back::before{content:"‹";font-size:30px;line-height:.8}

.step{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center;min-width:0}

details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .ab{padding:0 14px 14px;font-size:15px}
details.acc .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.coach-grid{display:grid;gap:9px;margin-top:4px}.coach-section{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}.coach-section>summary{display:flex;align-items:center;gap:9px;list-style:none;min-height:46px;padding:10px 12px;font-size:13px;font-weight:650}.coach-section>summary::-webkit-details-marker{display:none}.coach-section>summary .ico{width:17px;height:17px;color:var(--coach)}.coach-section>summary .count{margin-left:auto;color:var(--mut);font-size:11px;font-weight:500}.coach-section ul{list-style:none;margin:0;padding:0 12px 10px}.coach-section li{position:relative;padding:8px 0 8px 13px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.42;color:var(--ink)}.coach-section li::before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:var(--coach)}.paliers-grid{display:grid;gap:5px;margin:2px 0}.palier{display:grid;grid-template-columns:minmax(95px,1fr) minmax(88px,1fr);align-items:start;gap:4px 10px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}.palier b{font-size:11.5px;line-height:1.35}.palier span{font-size:11px;line-height:1.35;color:var(--mut)}.coach-Bilan{--coach:var(--easy)}.coach-Cardio{--coach:#b24a4a}.coach-Exécution{--coach:var(--long)}.coach-Récupération{--coach:#7b61a8}.coach-À-retenir{--coach:var(--qual)}
.i-drink{background:var(--drink)}.i-renfo{background:var(--renfo)}.i-cons{background:var(--card2)}.i-done{background:var(--done)}.i-cap{background:var(--cap)}

.cap b{font-size:22px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.res{display:flex;gap:4px}.res i{width:18px;height:6px;border-radius:3px;background:var(--line)}.res i.on{background:var(--easy)}
.pn{display:flex;gap:10px;margin-top:16px}.pn button{flex:1;background:var(--card);border-radius:14px;padding:12px;font-size:14px;text-align:left}
.pn button{display:flex;flex-direction:column;justify-content:flex-start}.pn button:last-child{text-align:right;align-items:flex-end}.pn small{display:block;color:var(--mut);font-size:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.check:last-child{border:0}.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.check.on .box{background:var(--easy);border-color:var(--easy)}.check.on .box::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.check.on .tx{color:var(--mut);text-decoration:line-through}

.chart{width:100%;display:block}.chart text{font-size:10px;fill:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:600}table.t td:not(:first-child),table.t th:not(:first-child){text-align:right}
table.t tr:last-child td{border:0}
table.t td,table.t th{white-space:nowrap}table.t td:first-child,table.t th:first-child{white-space:normal}
/* execution de seance */
.runview{min-height:calc(100vh - env(safe-area-inset-top));padding-bottom:12px}.runhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}.runhead button{min-width:44px;min-height:44px;color:var(--acc)}
.runhero{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px 18px;text-align:center;margin:8px 0 12px}.runhero .eyebrow{font-size:13px;opacity:.72;text-transform:uppercase;letter-spacing:.06em}.runhero h1{font-size:30px;margin:8px 0}.clock{font-variant-numeric:tabular-nums;font-size:64px;font-weight:750;line-height:1;letter-spacing:-.05em;margin:20px 0}.target{font-size:27px;font-weight:700}.target small{font-size:14px;font-weight:500;opacity:.7}.runbar{height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:20px}.runbar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.nextbox{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px 14px;margin:10px 0}.nextbox .ico{color:var(--acc)}
.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:9px;margin:14px 0}.controls button{min-height:56px;border-radius:16px;background:var(--card);font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}.controls .primary{background:var(--acc);color:#fff}
.stopbtn{min-height:48px;width:100%;color:var(--key);font-weight:650}

.choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.choice{min-width:46px;min-height:44px;border-radius:12px;background:var(--card2);padding:8px 12px;font-weight:650}.choice.on{background:var(--acc);color:#fff}.field{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);font:inherit;resize:none}.share-actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px;margin-bottom:14px}.share-actions button{min-height:52px;border-radius:13px;background:var(--card);font-weight:650;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px}.share-actions .primary{background:var(--acc);color:#fff}
.runhint{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.target small{font-size:17px;opacity:.9}.runhero .eyebrow{opacity:.86}.nextbox .sub{color:var(--ink);opacity:.7}.runhead button,.stopbtn{border-radius:12px;background:var(--card);padding:8px 12px}.stopbtn{margin-top:20px;border:1px solid color-mix(in srgb,var(--key) 35%,transparent)}
.strategy{display:grid;grid-template-columns:64px 82px 1fr;gap:0}.strategy>div{padding:10px 6px;border-bottom:1px solid var(--line)}.strategy .hd{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:700}

nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0;min-height:50px}
nav button.on{color:var(--acc)}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:24px}

const icon=(n,cl='')=>`<svg class="ico ${cl}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(x,d=1)=>x==null?'—':(+x).toFixed(d).replace('.',',').replace(/,0$/,'');
const dt=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const W0=dt('2026-09-28');
const week=s=>Math.floor((dt(s)-W0)/6048e5)+1;
const dlabel=s=>{const d=dt(s);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]};
const rel=s=>{const n=Math.round((dt(s)-dt(TODAY))/864e5);return n===0?"aujourd'hui":n===1?'demain':n===-1?'hier':dlabel(s)};
const REAL={};D.real.forEach(r=>(REAL[r.date]=REAL[r.date]||[]).push(r));
const DAYS=D.days, BY={};DAYS.forEach((d,i)=>{d.i=i;BY[d.date]=d});
const store={get:k=>{try{return JSON.parse(localStorage.getItem('semi:'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('semi:'+k,JSON.stringify(v))}catch(e){}}};

function dur(d){ if(d.actual_min!=null) return d.actual_min; if(d.steps) return d.steps.reduce((a,s)=>a+s.min,0); if(d.bike) return Math.round(d.bike.reduce((a,s)=>a+s.min,0));
  const m=(d.detail||'').match(/(\d+)\s*min/g); return m&&d.type!=='REPOS'?m.reduce((a,x)=>a+parseInt(x),0):0 }
function km(d){ return d.steps? d.steps.reduce((a,s)=>a+s.kmh*s.min/60,0):0 }
function hm(m){ if(!m) return ''; const h=Math.floor(m/60),r=Math.round(m%60); return h?h+' h'+(r?' '+String(r).padStart(2,'0'):''):r+' min' }
function summary(d){ if(d.type==='REPOS') return d.renfo?'Renfo 15 min':(d.detail||'Récupération');
  const p=[]; const m=dur(d); if(m) p.push(hm(m)); const k=km(d); if(k) p.push('≈ '+num(k)+' km');
  if(d.plafond) p.push('FC < '+d.plafond); if(d.bike) p.push('ERG'); if(d.renfo) p.push('+ renfo'); return p.join(' · ')||d.detail }
const nextSession=()=>DAYS.find(d=>d.date>=TODAY&&d.type!=='REPOS'&&!REAL[d.date]);

  const f=ds[0].date,l=ds[ds.length-1].date;

   <div class="list">${rows}</div></div>`;
}

function profile(d){
  const st=d.steps||d.bike; if(!st) return '';
  const tot=st.reduce((a,s)=>a+s.min,0);
  const v=s=>d.steps?s.kmh:s.lvl, lo=d.steps?4:.3, hi=d.steps?Math.max(10,...st.map(v)):Math.max(.9,...st.map(v));
  const h=x=>Math.max(8,(x-lo)/(hi-lo)*100);
  const bars=st.map(s=>{const walk=/marche/i.test(s.mode||'');
    if(s.ramp){const[a,z]=s.ramp;return [0,1,2].map(k=>`<div style="flex:${s.min/3};height:${h(a+(z-a)*(k+.5)/3)}%"></div>`).join('')}
    return `<div class="${s.fast?'f':''} ${walk?'w':''}" style="flex:${s.min};height:${h(v(s))}%"></div>`}).join('');
  return `<div class="card"><div class="profile-head"><b>Profil de la séance</b><span>${d.steps?'vitesse relative':'puissance relative'}</span></div><div class="prof">${bars}</div><div class="axis"><span>0</span><span>${hm(Math.round(tot/2))}</span><span>${hm(tot)}</span></div></div>`;
}

function coachItem(text){
  const m=text.match(/^Paliers suivis:\s*(.+)$/i);
  if(!m) return `<li>${esc(text)}</li>`;
  const paliers=m[1].split(/\),\s*/).map(x=>(x.endsWith(')')?x:x+')').trim());
  return `<li><b>Paliers suivis</b><div class="paliers-grid">${paliers.map(p=>{const x=p.match(/^(.*?\s+)?(\d+(?:,\d+)?)\s*\((.*)\)$/);if(!x)return `<div class="palier"><b>${esc(p)}</b></div>`;const label=(x[1]||'Palier').trim();return `<div class="palier"><b>${esc(label)} · ${esc(x[2])} km/h</b><span>${esc(x[3])}</span></div>`}).join('')}</div></li>`;
}

function coachView(sections){
  if(!sections||!sections.length) return '';
  const slug=s=>s.replace(/\s+/g,'-');
  return `<div class="coach-grid">${sections.map((s,i)=>`<details class="coach-section coach-${slug(s.title)}"${i===0?' open':''}><summary>${icon(s.icon)}<span>${esc(s.title)}</span><span class="count">${s.items.length} observation${s.items.length>1?'s':''}</span></summary><ul>${s.items.map(coachItem).join('')}</ul></details>`).join('')}</div>`;
}

     ${x.ressenti?`<div class="kv"><small>Ressenti</small><b>${x.ressenti}/5</b><div class="res">${[1,2,3,4,5].map(i=>`<i class="${i<=x.ressenti?'on':''}"></i>`).join('')}</div></div>`:''}</div>
     ${x.analysis&&x.analysis.length?`<details class="acc" style="background:var(--card2)"><summary>${icon('chart')} Analyse du coach</summary><div class="ab">${coachView(x.analysis)}</div></details>`:''}`,true)});
  const rk='renfo:'+s, rdone=store.get(rk)||[];

function bars(data,h=170){ // data:[{l,a,b}] a=prevu b=fait
  const W=340,pad=28,bw=(W-pad)/data.length, mx=Math.max(1,...data.map(d=>Math.max(d.a,d.b)));
  let g='';[0,.5,1].forEach(f=>{const y=h-24-f*(h-48);g+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="2" y="${y+3}">${hm(mx*f)}</text>`});
  data.forEach((d,i)=>{const x=pad+i*bw, ha=d.a/mx*(h-48), hb=d.b/mx*(h-48), pct=d.a?Math.round(d.b/d.a*100):0;
   g+=`<g onclick="go('${d.go}')" style="cursor:pointer"><rect x="${x+bw*.17}" y="${h-24-ha}" width="${bw*.66}" height="${ha}" rx="4" fill="var(--line)"/>
    <rect x="${x+bw*.17}" y="${h-24-hb}" width="${bw*.66}" height="${hb}" rx="4" fill="var(--acc)"/>
    <text x="${x+bw/2}" y="${h-7}" text-anchor="middle">${d.l}</text>${d.b?`<text x="${x+bw/2}" y="${Math.max(12,h-29-hb)}" text-anchor="middle" style="fill:var(--ink)">${pct}%</text>`:''}</g>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function vStats(){
  const ws=[...new Set(DAYS.map(d=>week(d.date)))].filter(w=>w<=7);
  const vol=ws.map(w=>{const ds=DAYS.filter(d=>week(d.date)===w);const a=ds.reduce((s,d)=>s+dur(d),0);
    const b=D.real.filter(r=>week(r.date)===w).reduce((s,r)=>s+(r.min||0),0);return{l:'S'+w,a,b,t:b?hm(b):hm(a),go:'#/plan/'+w}});
  const longs=DAYS.filter(d=>['LONGUE','CLE'].includes(d.type)&&d.steps);
  const lg=longs.map(d=>{const r=(REAL[d.date]||[])[0];return{l:dt(d.date).getDate()+'/'+(dt(d.date).getMonth()+1),a:dur(d),b:r?r.min:0,t:hm(r?r.min:dur(d)),go:'#/j/'+d.date}});
  const runs=D.real.filter(r=>r.distance_km&&r.fc_moy);
  // FC moyenne vs vitesse des seances de course
  const W=340,H=160; const xs=runs.map(r=>r.vitesse_moy_tapis||r.distance_km/(r.min/60)), ys=runs.map(r=>r.fc_moy);
  const x0=6,x1=Math.max(10,...xs),y0=120,y1=180, X=v=>24+(v-x0)/(x1-x0)*(W-34), Y=v=>H-18-(v-y0)/(y1-y0)*(H-30);
  let sc='';[130,150,170].forEach(v=>sc+=`<line x1="24" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="2" y="${Y(v)+3}">${v}</text>`);
  [6,7,8,9].forEach(v=>sc+=`<text x="${X(v)}" y="${H-4}" text-anchor="middle">${v}</text>`);
  const placed=[],labs=[];
  runs.map((r,i)=>[r,i]).sort((p,q)=>q[0].min-p[0].min).forEach(([r,i])=>{const op=.35+.65*(i+1)/runs.length,rad=4+Math.min(8,r.min/12),cx=X(xs[i]),cy=Y(ys[i]);
   sc+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="var(--long)" fill-opacity="${op}" stroke="var(--card)" stroke-width="1.5" onclick="go('#/j/${r.date}')"/>`;
   placed.push([cx,cy,rad]);labs.push([r,cx,cy,rad])});
  const boxes=[];const hit=(x,y)=>boxes.some(b=>Math.abs(b[0]-x)<26&&Math.abs(b[1]-y)<11)||placed.some(p=>Math.hypot(p[0]-x,p[1]-y+3)<p[2]+3);
  labs.forEach(([r,cx,cy,rad])=>{const t=dt(r.date).getDate()+'/'+(dt(r.date).getMonth()+1);
   const opts=[[cx,cy-rad-4],[cx,cy+rad+11],[cx+rad+16,cy+4],[cx-rad-16,cy+4],[cx,cy-rad-16],[cx,cy+rad+23]];
   const o=opts.find(([x,y])=>!hit(x,y)&&y>12&&y<H-20); if(o){boxes.push(o);sc+=`<text x="${o[0]}" y="${o[1]}" text-anchor="middle" style="fill:var(--ink)">${t}</text>`}});
  sc+=`<line x1="${X(D.ac)}" x2="${X(D.ac)}" y1="8" y2="${H-18}" stroke="var(--key)" stroke-dasharray="4 3"/><text x="${X(D.ac)-4}" y="16" text-anchor="end" style="fill:var(--key)">allure semi ${num(D.ac)} km/h</text><text x="${W}" y="${H-22}" text-anchor="end">km/h</text><text x="2" y="10">bpm</text>`;
  const tbl=D.real.slice().reverse().map(r=>`<tr onclick="go('#/j/${r.date}')"><td>${dt(r.date).getDate()}/${dt(r.date).getMonth()+1} <span class="sub">${esc(r.distance_km?'course':'vélo')}</span></td><td>${r.distance_km?num(r.distance_km,2):'—'}</td><td>${hm(r.min)}</td><td>${r.fc_moy||'—'}</td><td>${r.ressenti?r.ressenti+'/5':'—'}</td></tr>`).join('');
  const kmT=runs.reduce((a,r)=>a+r.distance_km,0), minT=D.real.reduce((a,r)=>a+(r.min||0),0);
  return `<div class="view"><div class="masthead"><div><div class="eyebrow">Progression</div><h1>Stats</h1></div><div class="date">10 séances<br>depuis le 1er oct.</div></div>
   <div class="kv3"><div class="kv metric-card"><small>Distance</small><b>${num(kmT)} km</b></div><div class="kv metric-card"><small>Temps</small><b>${hm(minT)}</b></div><div class="kv metric-card"><small>Séances</small><b>${D.real.length}</b></div></div>
   <div class="section-title"><h2>Volume</h2><span class="hint">réalisé / prévu</span></div><div class="card">${bars(vol)}<div class="legend"><span><i style="background:var(--line)"></i>prévu</span><span><i style="background:var(--acc)"></i>fait</span></div><p class="sub">Le pourcentage mesure le temps réalisé par rapport au programme. Touchez une barre pour ouvrir la semaine.</p></div>
   <div class="section-title"><h2>Sorties longues</h2><span class="hint">durée</span></div><div class="card">${bars(lg)}<div class="legend"><span><i style="background:var(--line)"></i>prévu</span><span><i style="background:var(--acc)"></i>fait</span></div></div>
   <div class="section-title"><h2>FC selon la vitesse</h2><span class="hint">course</span></div><div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}">${sc}</svg>
    <p class="sub">Chaque point = une séance de course, plus il est gros plus elle est longue, plus il est foncé plus elle est récente. Le but : des points plus bas (moins de FC) ou plus à droite (plus vite).</p></div>
   <div class="section-title"><h2>Historique</h2><span class="hint">séances faites</span></div><div class="card"><table class="t"><tr><th>Date</th><th>km</th><th>Durée</th><th>FC</th><th>Res.</th></tr>${tbl}</table></div></div>`;
}

function vGuide(){
  const acc=(ic,cls,t,b,o)=>`<details class="acc"${o?' open':''}><summary><span class="ic ${cls}">${icon(ic)}</span>${t}</summary><div class="ab">${b}</div></details>`;
  const H=D.hyd;
  return `<div class="view"><div class="masthead"><div><div class="eyebrow">Repères</div><h1>Guide</h1></div><div class="date">Objectif<br>${esc(D.cible.travail)}</div></div>
   ${acc('flag','i-cap','Le jour de la course',`<div class="strategy"><div class="hd">Segment</div><div class="hd">Cible</div><div class="hd">Consigne</div><div>0–5 km</div><div><b>8,8 km/h</b></div><div>Ne pas dépasser</div><div>5–16 km</div><div><b>9,0 km/h</b></div><div>Stabiliser</div><div>16–21,1</div><div><b>9,4+</b></div><div>Accélérer si possible</div></div><p class="sub" style="margin-top:12px">Si à mi-course tu te sens trop bien, c'est normal : le rythme est juste. ${esc(D.cible.cond)}</p>`,true)}
   ${acc('target','i-cons','Allure course',`<p><b>${num(D.ac)} km/h</b> aujourd'hui.</p><p class="sub">${esc(D.acRegle)}</p>`)}
   ${acc('drop','i-drink','Hydratation et gels',[['Footing',H.court],['Seuil',H.qual],['Test 30 min',H.test],['Kickr',H.kickr],['Longue 1h40',H['S3-LONG']],['Longue 1h50',H['S4-LONG']],['Pic 2h05',H['S5-LONG']],['Test décisif',H['S6-LONG']],['Jour J',H.course]].map(x=>`<p><b>${x[0]}</b><br><span class="sub">${esc(x[1])}</span></p>`).join(''))}
   ${acc('strength','i-renfo','Renfo musculaire',`<p class="sub">${esc(D.renfo.quand)}</p><ol>${D.renfo.ex.map(e=>`<li style="margin:6px 0">${esc(e)}</li>`).join('')}</ol><p class="sub">${esc(D.renfo.prog)}</p>`)}
   ${acc('rules','i-cons','Les règles',D.regles.map(r=>`<p><b>${esc(r[0])}</b><br><span class="sub">${esc(r[1])}</span></p>`).join(''))}
   ${acc('chart','i-cons','Test 30 min : la grille',`<table class="t"><tr><th>Distance en 30 min</th><th>Projection</th></tr>${D.test.map(x=>`<tr><td>${num(x[0],2)} km</td><td><b>${x[1]}</b></td></tr>`).join('')}</table>`)}
   <div class="foot">Mis à jour le ${D.gen}</div></div>`;
}

/* ---------- mode seance ---------- */
let RUN={date:null,idx:0,left:0,running:false,timer:null,started:false};
function runSteps(d){return d.steps||d.bike||[]}
function runTarget(d,p){return d.steps?`${num(p.kmh)} <small>km/h · pente ${p.pente} %</small>`:`${p.w} <small>W · ${p.pct} % FTP${p.cad?' · '+p.cad+' rpm':''}</small>`}
function vRun(s){
 const d=BY[s],st=d&&runSteps(d);if(!d||!st.length)return vDay(s);nav.style.display='none';
 if(RUN.date!==s){RUN={date:s,idx:0,left:Math.round(st[0].min*60),running:false,timer:null,started:false}}
 const p=st[RUN.idx],n=st[RUN.idx+1],tot=st.reduce((a,x)=>a+x.min*60,0),before=st.slice(0,RUN.idx).reduce((a,x)=>a+x.min*60,0),elapsed=before+(p.min*60-RUN.left),pct=Math.max(0,Math.min(100,elapsed/tot*100));
 return `<div class="view runview"><div class="runhead"><button onclick="exitRun()">Fermer</button><b>${esc(d.titre)}</b><span style="width:44px"></span></div>
 <div class="runhero"><div class="eyebrow">Étape ${RUN.idx+1} sur ${st.length}</div><h1>${esc(p.label)}</h1><div class="clock">${clock(RUN.left)}</div><div class="target">${runTarget(d,p)}</div>${d.plafond?`<div style="margin-top:9px;opacity:.75">FC sous ${d.plafond} bpm</div>`:''}<div class="runbar"><i style="width:${pct}%"></i></div></div>
 <div class="nextbox">${icon('next','lg')}<div><div class="sub">Ensuite</div><b>${n?esc(n.label)+' · '+clock(Math.round(n.min*60)):'Fin de séance'}</b></div></div>
 ${d.boire?`<div class="nextbox">${icon('drop','lg')}<div class="grow"><div class="sub">Hydratation</div><span class="runhint">${esc(d.boire)}</span></div></div>`:''}
 <div class="controls"><button onclick="runMove(-1)" aria-label="Étape précédente">${icon('prev')} <span class="sub">Préc.</span></button><button class="primary" onclick="runToggle()">${icon(RUN.running?'pause':'play')} ${RUN.running?'Pause':RUN.started?'Reprendre':'Démarrer'}</button><button onclick="runMove(1)" aria-label="Étape suivante"><span class="sub">Suiv.</span> ${icon('next')}</button></div>
 <button class="stopbtn" onclick="if(confirm('Terminer la séance et ouvrir le bilan ?'))finishRun()">Terminer et faire le bilan</button></div>`
}
function clock(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function runPaint(){const h=(location.hash||'').split('!')[0],p=h.slice(2).split('/');if(p[0]==='run'){$('#app').innerHTML=vRun(p[1]);window.scrollTo(0,0)}}
function runToggle(){RUN.running=!RUN.running;RUN.started=true;if(RUN.running){RUN.timer=setInterval(()=>{RUN.left--;if(RUN.left<=0)runMove(1,true);else runPaint()},1000)}else{clearInterval(RUN.timer)}runPaint()}
function runMove(delta,auto=false){clearInterval(RUN.timer);const d=BY[RUN.date],st=runSteps(d),ni=Math.max(0,Math.min(st.length-1,RUN.idx+delta));if(ni===RUN.idx&&auto){finishRun();return}RUN.idx=ni;RUN.left=Math.round(st[ni].min*60);if(auto&&navigator.vibrate)navigator.vibrate([180,100,180]);if(RUN.running)RUN.timer=setInterval(()=>{RUN.left--;if(RUN.left<=0)runMove(1,true);else runPaint()},1000);runPaint()}
function exitRun(){clearInterval(RUN.timer);RUN.running=false;nav.style.display='';go('#/j/'+RUN.date,true)}
function finishRun(){clearInterval(RUN.timer);RUN.running=false;nav.style.display='';go('#/feedback/'+RUN.date,true)}

function vFeedback(s){const d=BY[s];if(!d)return vHome();const saved=store.get('feedback:'+s)||{};setTimeout(()=>{Object.entries(saved).forEach(([k,v])=>{const e=document.querySelector(`[name="${k}"]`);if(e)e.value=v})},0);
 return `<div class="view"><button class="back" onclick="go('#/j/${s}')">Séance</button><h1>Bilan de séance</h1><div class="card"><b>${esc(d.titre)}</b><p class="sub">Ce bilan reste sur l'iPhone jusqu'au partage. Hermes l'intégrera avec le fichier .fit et la photo du tapis.</p>
 <h2>Ressenti</h2><div class="choices" id="feel">${[1,2,3,4,5].map(x=>`<button class="choice ${saved.ressenti==x?'on':''}" onclick="pick('ressenti','${x}',this)">${x}</button>`).join('')}</div>
 <h2>Douleur</h2><div class="choices" id="pain">${['Aucune','Tibia','Achille','Autre'].map(x=>`<button class="choice ${saved.douleur===x?'on':''}" onclick="pick('douleur','${x}',this)">${x}</button>`).join('')}</div>
 <h2>Hydratation et gels</h2><textarea class="field" name="hydratation" placeholder="Ex. 500 ml, gel à 50 min" oninput="saveFeedback('${s}')"></textarea>
 <h2>Note</h2><textarea class="field" name="note" placeholder="Ce qui a été facile ou difficile" oninput="saveFeedback('${s}')"></textarea></div>
 <div class="share-actions"><button onclick="copyFeedback('${s}')">${icon('copy')} Copier</button><button class="primary" onclick="shareFeedback('${s}')">${icon('share')} Partager à Hermes</button></div></div>`}
function pick(k,v,el){const box=el.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));el.classList.add('on');const s=(location.hash.split('!')[0]).split('/')[2],o=store.get('feedback:'+s)||{};o[k]=v;store.set('feedback:'+s,o)}
function saveFeedback(s){const o=store.get('feedback:'+s)||{};document.querySelectorAll('.field').forEach(e=>o[e.name]=e.value);store.set('feedback:'+s,o)}
function feedbackText(s){saveFeedback(s);const d=BY[s],o=store.get('feedback:'+s)||{};return `Bilan ${s} — ${d.titre}\nRessenti : ${o.ressenti||'non renseigné'}/5\nDouleur : ${o.douleur||'non renseignée'}\nHydratation/gels : ${o.hydratation||'non renseigné'}\nNote : ${o.note||'aucune'}\nFichiers .fit/photo déposés séparément.`}
async function copyFeedback(s){await navigator.clipboard.writeText(feedbackText(s));alert('Bilan copié. Colle-le dans la conversation avec Hermes.')}
async function shareFeedback(s){const text=feedbackText(s);if(navigator.share){try{await navigator.share({title:'Bilan running',text});return}catch(e){if(e.name==='AbortError')return}}await navigator.clipboard.writeText(text);alert('Bilan copié. Partage-le à Hermes depuis ton app de messagerie.')}

/* ---------- interactions ---------- */
function tog(k,i,el){const a=store.get(k)||[];const j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);store.set(k,a);el.classList.toggle('on')}
function go(h,replace){h=h+(window.__K?'!'+window.__K:'');replace?location.replace(h):(location.hash=h)}
function render(){
  const h=(location.hash||'#/').split('!')[0]||'#/', p=h.slice(2).split('/');
  let html, tab='#/';
  if(p[0]==='plan'){html=vPlan(+p[1]||0);tab='#/plan'}
  else if(p[0]==='j'){html=vDay(p[1]);tab='#/plan'}
  else if(p[0]==='run'){html=vRun(p[1]);tab='#/plan'}
  else if(p[0]==='feedback'){html=vFeedback(p[1]);tab='#/plan'}
  else if(p[0]==='stats'){html=vStats();tab='#/stats'}
  else if(p[0]==='guide'){html=vGuide();tab='#/guide'}
  else html=vHome();
  $('#app').innerHTML=html; window.scrollTo(0,0);
  if(p[0]!=='run')nav.style.display='';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===tab));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.r));
addEventListener('hashchange',render); render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js');
</script>
<script>
(async function(){
 const app=document.getElementById('app'), nav=document.getElementById('nav');
 const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const fromHash=(location.hash.split('!')[1]||'').trim();
 let k=fromHash||localStorage.getItem('semi:key')||'';
 async function open(k){
  const E=window.__E, raw=b64(E.ct), key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,raw);
  window.__D=JSON.parse(new TextDecoder().decode(pt)); window.__K=k;
  try{localStorage.setItem('semi:key',k)}catch(e){}
  nav.style.display=''; (0,eval)(document.getElementById('main').textContent);
 }
 function lock(msg){
  nav.style.display='none';
  app.innerHTML=`<div class="view" style="padding-top:18vh;text-align:center"><div style="font-size:54px">🔒</div><h1 style="margin:10px 0">Semi de Boulogne</h1>
   <p class="sub">${msg||'Ouvre le lien personnel envoyé par Hermes, ou colle ta clé ci-dessous.'}</p>
   <input id="kin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="clé" style="width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px">
   <button class="cta" style="width:100%" onclick="window.__try()">Ouvrir</button></div>`;
 }
 window.__try=async()=>{const v=document.getElementById('kin').value.trim().split('!').pop();try{await open(v)}catch(e){lock('Clé invalide.')}};
 if(!window.crypto||!crypto.subtle){lock("Ouvre cette page en https (lien GitHub Pages) : le déchiffrement n'est pas disponible ici.");return}
 if(!k){lock();return}
 try{await open(k)}catch(e){localStorage.removeItem('semi:key');lock('Clé invalide ou périmée.')}
})();
</script>
